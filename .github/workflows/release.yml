name: Release Lightroom plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches Info.lua version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $content = Get-Content -Raw LightroomPlugin/Cr3BurstExtractor.lrplugin/Info.lua
          if ($content -notmatch 'VERSION\s*=\s*\{\s*major\s*=\s*(\d+)\s*,\s*minor\s*=\s*(\d+)\s*,\s*revision\s*=\s*(\d+)') {
            throw "Could not parse VERSION block from Info.lua"
          }
          $infoVer = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          if ($infoVer -ne $tag) {
            throw "Tag v$tag does not match Info.lua version $infoVer — bump Info.lua before tagging."
          }
          Write-Host "Tag and Info.lua agree on $infoVer"

      - name: Build plugin
        shell: pwsh
        run: .\LightroomPlugin\build-plugin.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LightroomPlugin/Cr3BurstExtractor.lrplugin-v*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
