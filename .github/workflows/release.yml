name: Release Lightroom plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches AppInfo.cs version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $content = Get-Content -Raw Cr3BurstExtractor/AppInfo.cs
          if ($content -notmatch 'Version\s*=\s*"([^"]+)"') {
            throw "Could not find Version constant in AppInfo.cs"
          }
          $appVer = $Matches[1]
          if ($appVer -ne $tag) {
            throw "Tag v$tag does not match AppInfo.cs Version '$appVer' — bump AppInfo.cs before tagging."
          }
          Write-Host "Tag and AppInfo.cs agree on $appVer"

      - name: Build plugin
        shell: pwsh
        run: .\LightroomPlugin\build-plugin.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LightroomPlugin/Cr3BurstExtractor.lrplugin-v*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
